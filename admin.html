<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Choc des Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand" style="justify-content:space-between; width:100%;">
    <div style="display:flex; align-items:baseline; gap:10px;">
      <h1>ADMIN <span>·</span></h1>
      <small>Choc des Champions</small>
    </div>
    <button id="logout-btn" class="logout-btn">Déconnexion</button>
  </div>
</header>

<main>
  <div class="eyebrow">Tableau de bord</div>
  <h2>Joueurs inscrits</h2>
  <div id="counter" class="counter">Chargement...</div>
  <div id="content"><div class="loading">Vérification de la connexion...</div></div>
</main>

<script type="module" src="firebase-config.js"></script>
<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "admin-login.html";
  });

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "admin-login.html";
      return;
    }
    await loadPlayers();
  });

  async function loadPlayers() {
    const counterEl = document.getElementById("counter");
    const contentEl = document.getElementById("content");
    try {
      const q = query(collection(db, "registrations"), orderBy("date", "asc"));
      const snap = await getDocs(q);
      const players = snap.docs.map(d => d.data());

      counterEl.innerHTML = "<b>" + players.length + "</b> / 32 joueurs inscrits";

      if (players.length === 0) {
        contentEl.innerHTML = '<div class="empty">Aucune inscription pour le moment.</div>';
        return;
      }

      const rows = players.map((j, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${escapeHtml(j.pseudo)}</td>
          <td>${escapeHtml(j.nom)}</td>
          <td>${escapeHtml(j.whatsapp)}</td>
          <td>${escapeHtml(j.plateforme)}</td>
        </tr>`).join("");

      contentEl.innerHTML = `
        <table>
          <thead><tr><th>#</th><th>Pseudo</th><th>Nom complet</th><th>WhatsApp</th><th>Plateforme</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    } catch (e) {
      contentEl.innerHTML = '<div class="empty">Accès refusé ou erreur de chargement. Vérifie que ton email est bien autorisé dans les règles Firestore.</div>';
    }
  }
</script>
</body>
</html>
