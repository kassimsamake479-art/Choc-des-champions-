<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion admin — Choc des Champions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="eyebrow">Accès réservé</div>
  <h2>Espace admin</h2>
  <p class="lead">Connecte-toi avec ton compte admin Firebase.</p>

  <form id="login-form" style="max-width:100%;">
    <div>
      <label for="email">Email admin</label>
      <input type="email" id="email" required autofocus>
    </div>
    <div>
      <label for="password">Mot de passe</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="submit">Se connecter</button>
    <div id="err-msg" class="msg err"></div>
  </form>
</div>

<script type="module" src="firebase-config.js"></script>
<script type="module">
  import { auth } from "./firebase-config.js";
  import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errEl = document.getElementById("err-msg");
    errEl.className = "msg";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
      window.location.href = "admin.html";
    } catch (err) {
      errEl.textContent = "Email ou mot de passe incorrect.";
      errEl.className = "msg err";
    }
  });
</script>
</body>
</html>
